<!DOCTYPE html>
<html lang="{{lang:en}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <!-- ── highlight.js (syntax highlighting) ── -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <!-- ── Inline loader: resolves .claude/ from any plan depth ── -->
  <script data-planr-loader="2" data-skill-href="{{skillHref}}" data-skill-subpath="{{skillSubpath}}">
    (function() {
      // Tried in order until plan-styles.css loads; plan-runtime.js then loads
      // from the same place. 1: the relative path planr baked (data-skill-href).
      // 2: the .claude segment in this page's own path. 3: <dir>/.claude/<subpath>
      // for this page's directory and up to 9 of its ancestors.
      var me = document.currentScript, sub = me.getAttribute('data-skill-subpath');
      var hint = me.getAttribute('data-skill-href'), path = location.pathname;
      var bases = [], seen = {};
      function add(b) { b = new URL(b, location.href).href; if (!seen[b]) { seen[b] = 1; bases.push(b); } }
      if (hint) add(hint);
      var segs = path.split('/'), idx = segs.indexOf('.claude');
      if (idx !== -1) add(segs.slice(0, idx + 1).join('/') + '/' + sub);
      for (var d = path.substring(0, path.lastIndexOf('/')), n = 0; n < 10; n++) {
        add(d + '/.claude/' + sub);
        if (!d) break;
        d = d.substring(0, d.lastIndexOf('/'));
      }
      var i = 0;
      (function next() {
        if (i === bases.length) { console.error('html-planning: plan-styles.css not found; tried ' + bases.join(', ')); return; }
        var base = bases[i++], link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = base + '/plan-styles.css';
        link.onload = function() {
          var script = document.createElement('script');
          script.src = base + '/plan-runtime.js';
          document.head.appendChild(script);
        };
        link.onerror = function() { link.parentNode.removeChild(link); next(); };
        document.head.appendChild(link);
      })();
    })();
  </script>
</head>
<body>

<plan-nav></plan-nav>

<plan-header
  title="{{title}}"
  subtitle="{{subtitle:}}"
  status="{{status:draft}}"
  date="{{date}}">
</plan-header>

<main>

{{body}}

</main>

</body>
</html>
